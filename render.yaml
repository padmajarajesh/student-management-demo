# Optional Render Blueprint. In Render: New -> Blueprint -> select this repo.
# (You can also create the Web Service manually; see README section 12.)
services:
  - type: web
    name: student-management-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false   # e.g. jdbc:postgresql://ep-xxx.region.aws.neon.tech/neondb?sslmode=require
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false   # e.g. https://your-app.vercel.app

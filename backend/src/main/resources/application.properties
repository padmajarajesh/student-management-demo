# =====================================================================
# Student Management System - backend configuration
#
# Values come from environment variables. For local development you can
# also put them in backend/.env (see .env.example); that file is loaded
# below and is ignored by git.
# =====================================================================
spring.application.name=student-management
spring.config.import=optional:file:.env[.properties]

# Render injects PORT; locally we default to 8080
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# ---------------------------------------------------------------------
# Database (local PostgreSQL defaults; Neon values come from env vars)
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/student_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool (small pool suits free Neon/Render tiers)
spring.datasource.hikari.pool-name=StudentHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# ---------------------------------------------------------------------
# JPA / Hibernate - schema is owned by Flyway, Hibernate only validates
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------
# Flyway migrations (src/main/resources/db/migration)
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------
# Application settings
# ---------------------------------------------------------------------
# Comma-separated list of exact frontend origins allowed by CORS
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Development-only fallback secret. The prod profile has NO fallback,
# so production refuses to start without a real JWT_SECRET.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
app.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:15}
app.jwt.refresh-token-days=${JWT_REFRESH_DAYS:7}

# Local development runs on plain http://localhost, so cookies are not
# Secure and SameSite=Lax works (localhost:5173 and localhost:8080 are
# the same "site").
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

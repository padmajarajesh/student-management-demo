# =====================================================================
# Production profile (activated with SPRING_PROFILES_ACTIVE=prod).
# Used on Render with a Neon PostgreSQL database.
# Every secret is required - there are no fallback values here.
# =====================================================================

# Neon example: jdbc:postgresql://ep-xxxx.region.aws.neon.tech/neondb?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.frontend-url=${FRONTEND_URL}
app.jwt.secret=${JWT_SECRET}

# The frontend (vercel.app) and backend (onrender.com) are different
# sites served over HTTPS, so cookies must be Secure + SameSite=None.
app.cookie.secure=true
app.cookie.same-site=${COOKIE_SAME_SITE:None}

# Render terminates TLS in front of the app and forwards X-Forwarded-* headers
server.forward-headers-strategy=framework

logging.level.root=INFO
